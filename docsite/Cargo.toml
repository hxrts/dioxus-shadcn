[package]
name = "docsite"
authors = ["Daniel D’Aquino <daniel@daquino.me>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-shadcn.workspace = true
lucide-dioxus = { workspace = true, features = ["all-icons"] }
dioxus-sdk-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList", "Storage", "MediaQueryList"] }
wasm-bindgen = "0.2"

[features]
default = ["web"]
web = ["dioxus/web"]
analytics = []
