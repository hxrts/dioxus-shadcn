[package]
name = "dioxus-shadcn"
version = "1.0.0"
edition = "2024"
description = "A high-fidelity port of shadcn UI to Dioxus - accessible, styled components built on Dioxus Primitives"
readme = "../README.md"
keywords = ["gui", "dioxus", "components", "shadcn", "tailwind"]
categories = ["gui", "wasm"]
authors = ["Daniel D'Aquino <daniel@daquino.me>"]
license = "MIT"
homepage = "https://dioxus-shadcn.dev"
repository = "https://github.com/hxrts/dioxus-shadcn"

[lib]
doctest = false

[dependencies]
dioxus.workspace = true
dioxus-sdk-time.workspace = true
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", package = "dioxus-primitives", rev = "545aa7f55205b488f6403f92133fffb6c66838de" }
tracing.workspace = true
# Five categories, not all forty two. They are the smallest set of features that
# reaches every icon this crate draws, and no four of them do: `minus` is only
# in development, math, text and tools, and `circle` is only in shapes. That
# compiles 295 of lucide's 1648 icon modules rather than all of them.
#
# The set has to be stated here rather than left to the consumer. cargo unifies
# features across the graph, so a crate that declares all-icons imposes it on
# everyone who depends on this one, however few icons they draw.
lucide-dioxus = { workspace = true, features = [
    "notifications",
    "shapes",
    "cursors",
    "math",
    "gaming",
] }
gloo-timers = { version = "0.3", features = ["futures"] }
log = "0.4"

[dev-dependencies]
dioxus.workspace = true
env_logger = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "MouseEvent", "PointerEvent", "CssStyleDeclaration", "EventTarget", "DomRect"] }
